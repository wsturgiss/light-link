[tool]
id = "com.wsturgiss.lightlink"
label = "Link"
versionCode = 1
versionName = "0.1.0"
# CAMERA: scanning a device's "Receive via link" QR code to add it.
permissions = ["android.permission.INTERNET", "android.permission.CAMERA"]
capabilities = []
orientation = "portrait"
# Real LP3 hardware binds to the LightOS system app.
# Use "com.thelightphone.sdk.emulator" for the LightOS emulator instead.
serverPackage = "com.lightos"
